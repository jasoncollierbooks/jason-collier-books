<link rel="stylesheet" href="./styles.css">
<script>
/* Station breaks test mode (?breaks=test) also runs inside the game. Live visitors get nothing new. */
(function () {
  try {
    if (localStorage.getItem("jc-breaks-test") !== "1" && !/[?&]breaks=test/.test(location.search)) return;
    var s = document.createElement("script");
    s.src = "../commercials.js";
    document.head.appendChild(s);
  } catch (e) {}
})();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.min.js", "three/addons": "./vendor/three-addons.min.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="spotbar"><b id="spotfill"></b></div>
  <p id="thought" class="thought"></p>
  <div id="frost"></div>
  <div id="fear"></div>
  <div id="flash"></div>
  <div id="labels"></div>
  <div id="waypoint" class="waypoint"><i></i><span></span></div>

  <a id="home-pin" class="home-pin" href="../index.html" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path fill="currentColor" d="M12 3.2 3 11h2v9h5v-6h4v6h5v-9h2L12 3.2z"/></svg></a>
  <header id="hud" class="hud">
    <div class="row top">
      <div class="day" id="hudDay">DAY 1</div>
      <canvas id="compass" aria-hidden="true"></canvas>
      <div class="clock" id="hudClock">05:40 · DAWN</div>
    </div>
    <div class="objective" id="hudObjective"></div>
    <div class="nerve"><span>NERVE</span><i><b id="hudNerve"></b></i></div>
    <div class="warn" id="hudWarn"></div>
    <p class="line" id="hudLine"></p>
  </header>

  <div id="stick" class="stick"><div id="knob" class="knob"></div></div>

  <div id="actions" class="actions ui">
    <div class="status" id="hudStatus"></div>
    <div class="btns" id="ctxBtns"></div>
    <div class="btns fixed">
      <button id="btnLook" class="btn">LOOK</button>
      <button id="btnRifle" class="btn">RIFLE</button>
      <button id="btnNotes" class="btn ghost">NOTES</button>
      <button id="btnPause" class="btn ghost">II</button>
    </div>
  </div>
  <div id="keyhint" class="keyhint"></div>
  <div id="touchhint" class="touchhint">PUSH TO WALK<br><small>push lightly to sneak · double-tap to run</small></div>
  <div id="toast" class="toast"></div>

  <!-- glassing / scope -->
  <div id="optic" class="optic hidden">
    <div class="mask"></div>
    <div class="reticle"></div>
    <div class="optic-info"><span id="opticLabel"></span><span id="opticRange"></span></div>
    <div class="optic-bar"><i id="opticFill"></i></div>
    <div class="optic-ui ui">
      <button id="btnHold" class="btn">HOLD BREATH</button>
      <button id="btnFire" class="btn hot">FIRE</button>
      <button id="btnOpticClose" class="btn ghost">LOWER</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden"><div class="overlay-card ui" id="overlayCard"></div></div>
  <div id="leave" class="leave hidden" role="dialog" aria-modal="true" aria-labelledby="leave-q">
    <div class="leave-card">
      <p id="leave-q">Leave the game?</p>
      <div class="leave-actions">
        <button type="button" class="btn hot" id="leave-yes">Yes</button>
        <button type="button" class="btn" id="leave-no">No</button>
      </div>
    </div>
  </div>
  <div id="sheet" class="sheet hidden ui"></div>
  <div id="loading" class="loading"><p>Old Man on the Mountain</p><small id="loadMsg">Loading the mountain…</small><div class="loadtrack"><i id="loadBar"></i></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
